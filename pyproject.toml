[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satquery-preprocessing"
version = "0.1.0"
description = "Reusable BigEarthNet v2 TIFF preparation for CROMA"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "rasterio>=1.4", "torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "lmdb>=2.3"]
downloads = ["safetensors>=0.8"]
features = ["einops>=0.8", "huggingface-hub>=0.30"]
assistant = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.75",
  "pillow>=11",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34",
]

[project.scripts]
satquery-download-bigearthnet = "satquery.download_bigearthnet:main"
satquery-prepare-croma = "satquery.prepare_croma:main"
satquery-extract-croma = "satquery.extract_croma:main"
satquery-prepare-targets = "satquery.prepare_targets:main"
satquery-train-head = "satquery.train_prediction:main"
satquery-predict-cover = "satquery.predict_cover:main"
satquery-serve = "satquery.assistant.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/satquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/satquery/_vendor"]
